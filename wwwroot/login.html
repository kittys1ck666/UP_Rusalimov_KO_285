<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — CONDI</title>
  <link rel="stylesheet" href="site.css" />
</head>

<body data-page="login">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="title">UP_CONDI_V5</div>
        <div class="sub">Please sign in</div>
      </div>

      <nav class="nav">
        <button class="navbtn active" type="button" disabled>LOGIN</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="workpanel">
      <div class="inner">
        <div class="row" style="justify-content:space-between;">
          <div class="label">Authorization</div>
          <div class="pill">API: <span class="muted">/api/Auth</span></div>
        </div>

        <div style="margin-top: 14px;">
          <div class="formgrid">
            <div class="field">
              <label for="login_user">Login</label>
              <input id="login_user" placeholder="admin" autocomplete="username" />
              <div class="hint">Введите логин пользователя.</div>
              <div class="errtxt" id="err_login"></div>
            </div>

            <div class="field">
              <label for="login_pass">Password</label>
              <input id="login_pass" type="password" placeholder="123" autocomplete="current-password" />
              <div class="hint">Введите пароль.</div>
              <div class="errtxt" id="err_pass"></div>
            </div>
          </div>

          <div class="row" style="margin-top: 14px;">
            <button class="btn" id="btn_do_login" type="button">LOGIN</button>
            <button class="btn btn-lite" id="btn_register" type="button">REGISTER</button>
            <div class="spacer"></div>
            <button class="btn btn-lite" id="btn_go_app" type="button">GO TO APP</button>
          </div>

          <div class="muted" style="margin-top: 12px; font-family: ui-sans-serif, system-ui; font-size: 12px;">
            Подсказка: Enter — выполнить вход.
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Message modal -->
  <div class="modal" id="msg_modal" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title">
          <span class="badge" id="msg_kind">INFO</span>
          <span id="msg_title">Message</span>
        </div>
        <button class="btn btn-lite" data-close="1" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div id="msg_body" style="font-family: ui-sans-serif, system-ui; white-space: pre-wrap;">…</div>
        <details style="margin-top: 10px; font-family: ui-sans-serif, system-ui;">
          <summary>Details</summary>
          <pre id="msg_details" class="logbox" style="min-height:auto;"></pre>
        </details>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close="1" type="button">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
